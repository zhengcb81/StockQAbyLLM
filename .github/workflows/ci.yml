# GitHub Actions CI/CD Pipeline
# 统一入口：python -B scripts/checks.py（唯一 Python 定义点）
# 日常只跑一次依赖安装 + 单一受支持 Python；兼容矩阵 / full / report
# 只在 workflow_dispatch 显式选择大节点时执行。

name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      checks_mode:
        description: '检查模式（default / static-only / full / metrics）'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - static-only
          - full
          - metrics
      python_version:
        description: '兼容矩阵 Python 版本（仅显式大节点使用）'
        required: false
        default: '3.10'
        type: choice
        options:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    env:
      CHECKS_MODE: ${{ github.event.inputs.checks_mode || 'default' }}
      PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.10' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies (once)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run unified checks
      run: |
        case "$CHECKS_MODE" in
          static-only)
            python -B scripts/checks.py --static-only
            ;;
          full)
            python -B scripts/checks.py --full
            ;;
          metrics)
            python -B scripts/checks.py --metrics --output-dir ci-reports
            ;;
          *)
            python -B scripts/checks.py
            ;;
        esac

    - name: Upload metrics report
      if: env.CHECKS_MODE == 'metrics'
      uses: actions/upload-artifact@v5
      with:
        name: quality-metrics
        path: ci-reports/
        retention-days: 14

    - name: Upload coverage to Codecov
      if: env.CHECKS_MODE == 'metrics'
      uses: codecov/codecov-action@v5
      with:
        files: ./ci-reports/coverage.xml
        fail_ci_if_error: false
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
