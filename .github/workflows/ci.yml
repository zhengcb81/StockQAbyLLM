name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      checks_mode:
        description: Validation mode
        type: choice
        default: default
        options: [default, static-only, full, metrics]
      python_version:
        description: Python version for manual compatibility or metrics
        type: choice
        default: '3.13'
        options: ['3.10', '3.11', '3.12', '3.13']

permissions:
  contents: read

concurrency:
  group: stockqa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    if: github.event_name != 'workflow_dispatch' || inputs.checks_mode == 'default'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      STOCKQA_RUN_LIVE_E2E: '0'
      S6_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.S6_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Static checks and executable smoke
        run: |
          python -B scripts/checks.py --static-only
          python -B scripts/checks.py --only smoke
      - name: Reference checker behavior
        run: python -B -m unittest discover -s tools/anti_trick_gate_spec/tests
      - name: Collect and run the entire standalone offline suite
        shell: bash
        run: python -B -m tools.stockqa_release_tests --revision "$S6_REVISION" --evidence-dir "$RUNNER_TEMP/stockqa-s6"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: stockqa-offline-${{ runner.os }}
          path: |
            ${{ runner.temp }}/stockqa-s6/inventory.json
            ${{ runner.temp }}/stockqa-s6/execution.json
          retention-days: 14

  manual:
    if: github.event_name == 'workflow_dispatch' && inputs.checks_mode != 'default'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHECKS_MODE: ${{ inputs.checks_mode }}
      STOCKQA_RUN_LIVE_E2E: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run compatibility or metrics checks
        run: |
          case "$CHECKS_MODE" in
            static-only) python -B scripts/checks.py --static-only ;;
            full) python -B scripts/checks.py --full ;;
            metrics) python -B scripts/checks.py --metrics --output-dir ci-reports ;;
          esac
      - uses: actions/upload-artifact@v5
        if: inputs.checks_mode == 'metrics'
        with:
          name: quality-metrics
          path: ci-reports/
          retention-days: 14
      - uses: codecov/codecov-action@v5
        if: inputs.checks_mode == 'metrics'
        with:
          files: ./ci-reports/coverage.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
