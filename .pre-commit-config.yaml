# Pre-commit hooks configuration for StockQAbyLLM
# Run: pre-commit run --all-files
# Install: pre-commit install
#
# 这里只保留便宜的静态检查（格式 / 类型 / 文件完整性 / 密钥泄露）。
# 完整检查统一入口是：python -B scripts/checks.py
# （pytest、bandit 报告、pylint 数值、联网 pip-audit 都不再挂在每次 commit 上。）

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python code formatting with black（版本与 requirements-lock.txt 同步）
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  # Import sorting with isort（版本与 requirements-lock.txt 同步）
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ['--profile', 'black']

  # Type checking with mypy（以 pyproject.toml 单份配置为准，不额外加 --strict）
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
        args: ['--config-file=pyproject.toml', 'src/']
        pass_filenames: false

  # Secret detection - prevents API keys and tokens from being committed
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            \.env\.example|
            llm_apis\.json\.example|
            examples/.*|
            tests/.*|
            .*\.lock
          )$

# Pre-commit configuration
default_stages: [pre-commit]
default_language_version:
  python: python3

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
