# Pre-commit hooks configuration for StockQAbyLLM
# Run: pre-commit run --all-files
# Install: pre-commit install

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python code formatting with black
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: ['--profile', 'black']

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
        args: ['--config-file=pyproject.toml', 'src/']
        pass_filenames: false

  # Linting with pylint
  - repo: local
    hooks:
      - id: pylint
        name: pylint (score >= 9.0)
        entry: pylint
        language: system
        args: ['--fail-under=9.0', 'src/']
        types: [python]
        pass_filenames: false

  # Secret detection - prevents API keys and tokens from being committed
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            \.env\.example|
            llm_apis\.json\.example|
            examples/.*|
            tests/.*|
            .*\.lock
          )$

  # Security scanning with bandit
  - repo: local
    hooks:
      - id: bandit
        name: bandit (security scan)
        entry: bandit
        language: system
        args: ['-r', 'src/', '-f', 'json', '-o', 'bandit-report.json']
        pass_filenames: false

  # Security audit with pip-audit
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: python -m pip_audit
        language: system
        pass_filenames: false
        always_run: true

  # pytest for running tests before commit
  - repo: local
    hooks:
      - id: pytest
        name: pytest (unit tests)
        entry: pytest
        language: system
        args: ['tests/unit/', '-v', '--tb=short']
        pass_filenames: false
        always_run: true

# Pre-commit configuration
default_stages: [pre-commit]
default_language_version:
  python: python3

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
