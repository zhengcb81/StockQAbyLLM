# Pre-commit hooks configuration for StockQAbyLLM
# Run: pre-commit run --all-files
# Install: pre-commit install

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(tests/|\.md$)
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python code formatting with black
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.10
        args: ['--line-length=100']

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile', 'black', '--line-length', '100']

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
        args: ['--strict', '--ignore-missing-imports']
        exclude: ^(tests/|examples/)

  # Linting with pylint
  - repo: local
    hooks:
      - id: pylint
        name: pylint (score >= 8.0)
        entry: pylint
        language: system
        args: ['--fail-under=8.0', '--exit-zero']
        types: [python]
        exclude: ^(tests/|examples/|scripts/)

  # Security scanning with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-ll', '-f', 'screen']
        exclude: ^tests/

  # Complexity check with radon
  - repo: local
    hooks:
      - id: radon-cc
        name: radon cyclomatic complexity
        entry: radon
        language: system
        args: ['cc', '-a', '-nb']
        types: [python]
        exclude: ^(tests/|examples/)

      - id: radon-mi
        name: radon maintainability index
        entry: radon
        language: system
        args: ['mi', '--min', 'B']
        types: [python]
        exclude: ^(tests/|examples/)

  # pytest for running tests before commit
  - repo: local
    hooks:
      - id: pytest
        name: pytest (quick tests)
        entry: pytest
        language: system
        args: ['tests/unit/', '-v', '--tb=short']
        pass_filenames: false
        always_run: true

# Pre-commit configuration
default_stages: [pre-commit]
default_language_version:
  python: python3.10

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
