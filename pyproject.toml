[project]
name = "StockQAbyLLM"
version = "0.1.0"
description = "基于大语言模型的股票问答系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "aiohttp>=3.14.3",
]
license = {text = "MIT"}
authors = [
    {name = "Your Name"}
]
keywords = ["qa", "llm", "stock", "question-answering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-html>=3.2.0",
    "pytest-benchmark>=5.2.0",
    "pytest-asyncio>=1.3.0",
    "black>=26.3.1",
    "mypy>=1.5.0",
    "pylint>=2.17.0",
    "bandit>=1.7.6",
    "radon>=6.0.1",
    "pre-commit>=3.5.0",
    "types-requests>=2.31.0",
    "pip-audit>=2.7.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.25.0",
]

# Quality Gates Configuration (tool table — PEP 621 forbids custom keys under [project])
[tool.quality-gates]
# Coverage gate: minimum 87% coverage required
coverage_minimum = 87
# Pylint gate: minimum 9.0/10 score required
pylint_minimum = 9.0
# Mypy gate: must use --strict mode (0 errors allowed)
mypy_strict = true
# Complexity gate: no function with cyclomatic complexity > 15
complexity_maximum = 15

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
# Documentation build scripts
docs-serve = "mkdocs:serve"
docs-build = "mkdocs:build"
# Security scan script
security-scan = "scripts.security_scan:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "benchmark: Benchmark tests (requires pytest-benchmark)",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
]

[tool.pylint.format]
max-line-length = 100

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
