[project]
name = "StockQAbyLLM"
version = "0.1.0"
description = "基于大语言模型的股票问答系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "aiohttp>=3.14.3",
    "jsonschema[format-nongpl]>=4.23.0",
]
license = {text = "MIT"}
authors = [
    {name = "Your Name"}
]
keywords = ["qa", "llm", "stock", "question-answering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    # Check tools are pinned to requirements-lock.txt so CI cannot drift.
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "pytest-html==4.1.1",
    "pytest-benchmark==5.2.3",
    "pytest-asyncio==1.3.0",
    "black==26.5.1",
    "isort==7.0.0",
    "mypy==1.19.0",
    "pylint==4.0.4",
    "bandit==1.9.3",
    "radon==6.0.1",
    "pre-commit==4.5.1",
    "types-requests==2.32.4.20260107",
    "pip-audit==2.10.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.25.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
# Documentation build scripts
docs-serve = "mkdocs:serve"
docs-build = "mkdocs:build"
# Security scan script
security-scan = "scripts.security_scan:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 默认不注入任何 coverage / XML / HTML / 报告产物；
# 指标模式由 scripts/checks.py --metrics 显式写入 --output-dir。
# `-p no:base_url` 阻断环境里未声明的 pytest-base-url 插件：它的 session 级
# base_url fixture 与本仓库用例的 base_url 参数同名，会触发 ScopeMismatch。
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-p",
    "no:base_url",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "benchmark: Benchmark tests (requires pytest-benchmark)",
    "live: Opt-in tests that call a real external provider and may incur usage costs",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "referencing", "referencing.*"]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
]

[tool.pylint.format]
max-line-length = 100

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
